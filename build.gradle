plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

def targetJavaVersion = 21

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
    maven { url "https://jitpack.io" }
    maven { url "https://maven.bawnorton.com/releases" }
    maven {
    name = "Modrinth"
    url = "https://api.modrinth.com/maven"
}

}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation("maven.modrinth:sodium:mc1.21.11-0.8.6-fabric")
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "eu.pb4:placeholder-api:2.8.2+1.21.10"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:21.11.153") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnly "org.projectlombok:lombok:1.18.12"
    annotationProcessor "org.projectlombok:lombok:1.18.30"

    modImplementation "com.github.Fallen-Breath.conditional-mixin:conditional-mixin-fabric:0.6.4"
    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.2-beta.4")))
}

processResources {
    inputs.properties([
        "version": project.version,
        "minecraft_version": project.minecraft_version,
        "loader_version": project.loader_version
    ])
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand([
            "version": project.version,
            "minecraft_version": project.minecraft_version,
            "loader_version": project.loader_version
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    if (JavaVersion.current() < JavaVersion.toVersion(targetJavaVersion)) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}


remapJar {
    archiveFileName = "${project.base.archivesName.get()}-${project.minecraft_version}+${version}.${project.jar.archiveExtension.get()}"
}

